shopware:
    deployment:
        # Several containers share one shop: never run Composer or delete the local container cache at runtime.
        # Extensions live in shared volumes, so the Administration can still install and update them.
        cluster_setup: true

    # The web updater writes into the image and is lost on the next deploy. Update by pulling a new image.
    auto_update:
        enabled: false
        hide_module: true

    # CLI workers process the queue.
    admin_worker:
        enable_admin_worker: false

    redis:
        connections:
            cache:
                dsn: '%env(REDIS_CACHE_URL)%'
            store:
                dsn: '%env(REDIS_STORE_URL)%'

    cache:
        compress: true
        compression_method: zstd
        invalidation:
            delay_options:
                storage: redis
                connection: store

    cart:
        compress: true
        compression_method: zstd
        storage:
            type: redis
            config:
                connection: store

    increment:
        user_activity:
            type: redis
            config:
                connection: store
        message_queue:
            type: redis
            config:
                connection: store

    mail:
        update_mail_variables_on_send: false
