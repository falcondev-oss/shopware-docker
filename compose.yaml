x-shopware: &shopware
  image: ${IMAGE:-ghcr.io/falcondev-oss/shopware:6.7}
  # The base image checks Caddy, which only runs in web.
  healthcheck:
    disable: true
  environment:
    APP_URL: ${APP_URL:?}
    APP_SECRET: ${APP_SECRET:?}
    INSTANCE_ID: ${INSTANCE_ID:?}
    DATABASE_URL: mysql://shopware:${DB_PASSWORD:?}@database:3306/shopware
    MAILER_DSN: ${MAILER_DSN:-null://null}
    REDIS_CACHE_URL: redis://valkey-cache:6379?persistent=1
    REDIS_STORE_URL: redis://valkey-store:6379?persistent=1
    LOCK_DSN: redis://valkey-store:6379
    MESSENGER_TRANSPORT_DSN: redis://valkey-store:6379/async?auto_setup=false
    MESSENGER_TRANSPORT_LOW_PRIORITY_DSN: redis://valkey-store:6379/low_priority?auto_setup=false
    PHP_SESSION_HANDLER: redis
    PHP_SESSION_SAVE_PATH: 'tcp://valkey-store:6379?persistent=1&prefix=session:'
    PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512m}
    PHP_MAX_UPLOAD_SIZE: ${PHP_MAX_UPLOAD_SIZE:-128m}
    LOG_LEVEL: ${LOG_LEVEL:-error}
    # Only read on the first deploy
    INSTALL_LOCALE: ${INSTALL_LOCALE:-de-DE}
    INSTALL_CURRENCY: ${INSTALL_CURRENCY:-EUR}
    INSTALL_ADMIN_USERNAME: ${INSTALL_ADMIN_USERNAME:-admin}
    INSTALL_ADMIN_PASSWORD: ${INSTALL_ADMIN_PASSWORD:?}
    INSTALL_ADMIN_EMAIL: ${INSTALL_ADMIN_EMAIL:-}
    SALES_CHANNEL_URL: ${APP_URL}
    # Shop-specific Symfony and Shopware config as YAML, see README
    SHOPWARE_CONFIG: ${SHOPWARE_CONFIG:-}
  volumes:
    - plugins:/var/www/html/custom/plugins
    - apps:/var/www/html/custom/apps
    - bundles:/var/www/html/public/bundles
    - files:/var/www/html/files
    - media:/var/www/html/public/media
    - thumbnail:/var/www/html/public/thumbnail
    - theme:/var/www/html/public/theme
    - sitemap:/var/www/html/public/sitemap

# Every Shopware container installs or updates Shopware on start when the database
# does not have the image version yet. One does the work, the others wait for it.
services:
  web:
    <<: *shopware
    deploy:
      # The new task runs the migrations and passes its healthcheck before the old one stops.
      # If it never gets healthy, the old one keeps running and the update pauses.
      update_config:
        order: start-first
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8000/api/_info/health-check]
      # Covers the first install and long migrations
      start_period: 10m
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *shopware
    # Messenger consumer name. Stays the same when Swarm replaces the task.
    hostname: '{{.Service.Name}}-{{.Task.Slot}}'
    command: [php, bin/console, messenger:consume, webhook, async, low_priority, --time-limit=3600, --memory-limit=384M]
    stop_grace_period: 120s
    deploy:
      replicas: ${WORKER_REPLICAS:-2}

  scheduler:
    <<: *shopware
    command: [php, bin/console, scheduled-task:run, --memory-limit=256M]

  database:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: shopware
      MARIADB_USER: shopware
      MARIADB_PASSWORD: ${DB_PASSWORD:?}
      MARIADB_RANDOM_ROOT_PASSWORD: 1
      MARIADB_AUTO_UPGRADE: 1
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --group-concat-max-len=320000
      - --default-time-zone=+00:00
      - --max-allowed-packet=128M
      - --max-connections=${DB_MAX_CONNECTIONS:-500}
      - --skip-name-resolve
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-1G}
      - --innodb-log-file-size=${DB_LOG_FILE_SIZE:-256M}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3

  # HTTP and object cache, not persisted. allkeys-lru is safe: when a tag version is evicted,
  # the entries with that tag count as invalid.
  valkey-cache:
    image: valkey/valkey:9-alpine
    command: [valkey-server, --save, '', --appendonly, 'no', --maxmemory, '${CACHE_MAXMEMORY:-1gb}', --maxmemory-policy, allkeys-lru]
    healthcheck: &valkey-healthcheck
      test: [CMD, valkey-cli, ping]
      start_period: 10s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3

  # Sessions, carts, locks, message queue. Persisted and never evicted.
  valkey-store:
    image: valkey/valkey:9-alpine
    command: [valkey-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory-policy, noeviction]
    volumes:
      - valkey-store:/data
    healthcheck: *valkey-healthcheck

volumes:
  database:
  valkey-store:
  plugins:
  apps:
  bundles:
  files:
  media:
  thumbnail:
  theme:
  sitemap:

